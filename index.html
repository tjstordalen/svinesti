<!DOCTYPE html>


<html>
<head>
    <title>Svinesti</title>
	<link rel="stylesheet" href="styles.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.19/codemirror.min.css">
	<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.19/codemirror.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.19/mode/python/python.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.19/mode/clike/clike.min.js"></script>
</head>
<body>
<header> </header>
<div id="menu">
</div>
<div id="container">
	<div id="level-selection-area">
	<ul id="level-list">
	</ul>
	</div>

	<div id="code-area">
		<textarea id="code-input"></textarea>
		<div id="controls">
			<div id="editor-controls">
				<fieldset id="editor-font-size">
				<legend>Font size:</legend>
				<input id="editor-font-size-slider" type="range" min="6" max="35" value="15" step="1">
				</fieldset>

				<fieldset id="editor-language-selection">
				<legend>Language:</legend>
					<label>
					<input id="select-lang-python" type="radio" name="language-choice" value="python" checked>
					Python 3
					</label>
	  
					<label>
					<input id="select-lang-java" type="radio" name="language-choice" value="java">
					Java 
					</label>
				</fieldset>	
			</div>

			<div id="playback-controls">
				<fieldset>
				<legend>Animation speed:</legend>
				<input type="range" id="playback-speed" min="10" max="400" value="150" step="10">
				</fieldset>

				<button id="playback-run-code">Run</button>
				<button id="playback-step">Step</button>
				<button id="playback-stop">Stop</button>
			</div>
		</div>
<pre id="code-output"> </pre>
	</div>
	<div id="game-view">
		<div id="grid"></div>
	</div>
</div>
</body>

<script type="importmap">
{ 
	"imports": {
		"antlr4": "https://cdn.jsdelivr.net/npm/antlr4@4.13.2/+esm"
	}
}
</script>
<script src="levels.js"></script>
<script type="module" src="main.js"></script>
</html>
