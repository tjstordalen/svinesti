<!DOCTYPE html>


<html>
<head>
    <title>Svinesti</title>
	<link rel="stylesheet" href="styles.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.19/codemirror.min.css">
	<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.19/codemirror.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.19/mode/python/python.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.19/mode/clike/clike.min.js"></script>
</head>
<body>
<header> </header>
<div id="menu">
</div>
<div id="container">
	<div id="level-selection-area">
	<ul id="level-list">
	</ul>
	</div>

	<div id="code-area">
		<textarea id="code-input"></textarea>
		<div id="controls">
			<div id="editor-controls">
				<fieldset id="editor-font-size">
				<legend>Font size:</legend>
				<input id="editor-font-size-slider" type="range" min="6" max="35" value="15" step="1">
				</fieldset>

				<fieldset id="editor-language-selection">
				<legend>Language:</legend>
					<label>
					<input id="select-lang-python" type="radio" name="language-choice" value="python" checked>
					Python 3
					</label>
	  
					<label>
					<input id="select-lang-java" type="radio" name="language-choice" value="java">
					Java 
					</label>
				</fieldset>	
			</div>

			<div id="playback-controls">
				<fieldset>
				<legend>Animation speed:</legend>
				<input type="range" id="playback-speed" min="10" max="400" value="150" step="10">
				</fieldset>

				<button id="playback-run-code">Run</button>
				<button id="playback-stop-or-step"> Step</button>
			</div>
		</div>
<pre id="code-output"> </pre>
	</div>
	<div id="game-view">
		<div id="grid"></div>
	</div>
</div>
</body>

<script type="importmap">
{ 
	"imports": {
		"antlr4": "https://cdn.jsdelivr.net/npm/antlr4@4.13.2/+esm"
	}
}
</script>
<script src="BoardView.js"></script>
<script src="PlaybackHandler.js"></script>
<script src="levels.js"></script>
<script type="module">

import * as PigJatin from "./PigJatin/PigJatin.js";
PigJatin.loadTestCases("./PigJatin/testcases.txt").then(PigJatin.runTests)

function selectedLanguage(){
	const selectedRadio = document.querySelector( 'input[name="language-choice"]:checked');
	return selectedRadio.value;
}

// Initialize the part showing the actual game board

const grid = document.getElementById("grid");
const boardView = new BoardView(grid);



// Code editor

const codeInput = document.getElementById("code-input");
const codeOutput = document.getElementById("code-output");
const editor = CodeMirror.fromTextArea(codeInput, {
	lineNumbers: true,
	lineWrapping: true,
	mode: "python",
	theme: "default"

});

editor.highlightLine = (lineno) => {
	lineno-- // lines are zero-indexed
	const prev = editor.highlightedLine;
	if (prev !== undefined && prev >= 0) {
		editor.removeLineClass(prev, "background", "highlighted-line");
	}
	if (lineno < 0 || lineno > editor.lineCount()) {
		editor.highlightedLine = undefined;
		return;
	}
	editor.highlightedLine = lineno;
	editor.addLineClass(lineno, "background", "highlighted-line");
}

editor.updateMode = () => {
	const mode = selectedLanguage() === "java" ? "text/x-java" : "python";
	editor.setOption("mode", mode);
}

// Functions for storing and loading user code in browser
function storeCode(lvl, lang){
	if (!lvl) return;
	const codeKey = lvl.name + lang;
	localStorage.setItem(codeKey, editor.getValue()); 
}

function loadCode(lvl, lang){
	if (!lvl) return;
	const codeKey = lvl.name + lang;
	const code = localStorage.getItem(codeKey) ?? "";
	editor.setValue(code);
	editor.updateMode();
}	

// Initialize the list of levels

const levelList = document.getElementById("level-list");
let selectedLevel = null; 

for (let lvl of levels) {

	// if present, removes the target from the starting position of the agent
	const [r,c] = lvl.pos;
	const tmp = [...lvl.grid[r]];
	tmp[c] = tmp[c].toLowerCase();
	lvl.grid[r] = tmp.join("");

	const name = lvl.name;
	const item = document.createElement("li");
	const btn  = document.createElement("button");
	item.appendChild(btn);
	btn.textContent = name;
	btn.level = lvl;
	levelList.appendChild(item);

	btn.addEventListener("click", event => {
		storeCode(selectedLevel, selectedLanguage());
		selectedLevel = btn.level;	
		loadCode(selectedLevel, selectedLanguage());

		boardView.resetGameState(btn.level);
		levelList.querySelectorAll("li button").forEach(btn => btn.classList.remove("selected"))
		btn.classList.add("selected");

		codeOutput.textContent = "";
		editor.updateMode();
	});
}


// Select the first level
levelList.querySelector("li button").click();

const controlsDiv = document.getElementById("playback-controls");
const controls    = new PlaybackHandler(controlsDiv, editor, boardView)


let worker = null;
let rebootTimeout = null;

function reboot(){
	controls.stop();	
	console.log("Rebooting worker!");
	if (worker) worker.terminate();
	worker = new Worker("worker.js");
	worker.onmessage = (event) => {
		if (event.data.type === "execution-trace"){
			controls.init(event.data.trace);
		}
		else if (event.data.type === "execution-failed"){
			codeOutput.textContent = event.data.errorMessage;
			codeOutput.scrollTop = codeOutput.scrollHeight;
		}
		clearTimeout(rebootTimeout);
	}
}

reboot();

const submitCode = () => {

	if (controls.resume()) return;

	codeOutput.textContent = "";

	let program = editor.getValue();

	if (selectedLanguage() === "java"){
		const [success,error,code] = PigJatin.generatePythonCode(program);
		if (!success) {
			codeOutput.textContent = error.msg;
			codeOutput.scrollTop = codeOutput.scrollHeight;
			return;
		}
		program = code; 
		console.log("The program is", code);
		worker.postMessage({ code: program, level: JSON.stringify(selectedLevel)});
	}
	else {
		worker.postMessage({ code: program, level: JSON.stringify(selectedLevel)});
	}

	// Reboot the worker if it runs for too long, due to e.g., infinte loops in student code
	rebootTimeout = setTimeout(() => reboot(), 1000);
}

document.addEventListener('keydown', (event) => {
	if (event.ctrlKey && event.key === "Enter"){
		submitCode()
	}
});

document.getElementById("playback-run-code").onclick = (event) => submitCode();

editor.on("change", () => storeCode(selectedLevel,selectedLanguage()));

document.getElementById("editor-font-size-slider").addEventListener("input", (e) => {
	editor.getWrapperElement().style.fontSize = e.target.value.toString() + "px";

});

document.addEventListener("change", e => {
	if(e.target.type === 'radio' && e.target.name === "language-choice"){
		const lang = selectedLanguage();
		const other = lang === "python" ? "java" : "python";
		storeCode(selectedLevel, other);
		loadCode(selectedLevel,lang);
	}
});

</script>
</html>
