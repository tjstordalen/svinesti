name: Update cache version
on:
  push:
    branches: [publish]

jobs:
  update-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace version placeholders
        run: |
          VERSION=$(git rev-parse --short HEAD)
          find . -name '*.html' -o -name '*.js' | xargs sed -i "s/@version-[^@]*@/@version-$VERSION@/g"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet || (git add -A && git commit -m "Update cache version" && git push)
